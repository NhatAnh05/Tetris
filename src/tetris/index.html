<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Core Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="game-container">
    <h1>TETRIS</h1>

    <!-- Bảng game -->
    <div class="game-layout">
        <div class="board-container">
            <canvas id="game-board" width="300" height="600"></canvas>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">

            <!-- Level của game -->
            <div class="info-box">
                <div>Level</div>
                <select id="level-select">
                    <option value="0" selected>Level 0 - Core</option>
                    <option value="1">Level 1 - Time Attack</option>
                </select>
            </div>

            <!-- Hiển thị next piece -->
            <div class="info-box next-pice-box">
                <span>NEXT PIECE</span>

                <canvas id="next-piece-board" width="120" height="120"></canvas>
            </div>

            <!-- Thời gian điếm ngược cho người chơi chọn level 1 -->
            <div class="info-box" id="timer-box">
                <span>THỜI GIAN</span>

                <strong id="time-left">--</strong>
            </div>

            <div class="info-box">
                <div>Điểm</div>
                <strong id="score">0</strong>
            </div>

            <div class="info-box">
                <div>Số dòng</div>
                <strong id="lines">0</strong>
            </div>

            <div class="info-box">
                <div>Trạng thái</div>
                <strong id="game-state">SẴN SÀNG</strong>
            </div>

            <div class="controls">
                <button id="start-btn">Bắt đầu</button>
                <button id="pause-btn">Tạm dừng</button>
                <button id="restart-btn">Chơi lại</button>
            </div>

            <div class="help">
                <h3>Điều khiển</h3>
                <p>← → : Di chuyển</p>
                <p>↓ : Rơi nhanh</p>
                <p>↑ : Xoay</p>
                <p>Space : Rơi xuống</p>
                <p>P : Tạm dừng</p>
                <p>R : Chơi lại</p>
            </div>

            <div class="level-note" id="level-note">
                Level 0: Core Tetris.
                Không có giới hạn thời gian.
            </div>
        </div>
    </div>
</div>

<script src="js/board.js"></script>
<script src="js/tetromino.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
